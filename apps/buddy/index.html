<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AnimePix · Viva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="topbar">
    <span class="brand">AnimePix <small>× Viva</small></span>
    <span class="tag" id="mock" hidden>sample data</span>
  </header>

  <main class="layout">
    <section class="push" id="push" aria-label="The push under review" aria-live="polite"></section>

    <aside class="buddy-panel" aria-label="Choose your buddy">
      <div class="section-label">Your buddy</div>
      <label class="sr-only" for="buddy-series">Anime series</label>
      <select id="buddy-series" class="buddy-series"></select>
      <div class="picker" id="picker" role="group" aria-label="Characters"></div>
      <p class="selected-buddy">Watching your pushes: <b id="selected-buddy" aria-live="polite"></b></p>
    </aside>
  </main>

  <div class="stage" id="stage"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
